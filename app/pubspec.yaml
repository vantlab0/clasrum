name: ai_classroom
description: >-
  AI Personal Classroom — a premium private classroom where a realtime AI tutor
  teaches live on a chalk blackboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  record: ^7.1.2
  flutter_pcm_sound: ^3.3.3
  flutter_math_fork: ^0.7.4
  supabase_flutter: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Chalkboard
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
    - family: ChalkScript
      fonts:
        - asset: assets/fonts/Caveat-VariableFont_wght.ttf
