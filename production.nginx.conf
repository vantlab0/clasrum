# Production Nginx Configuration for realtime.avelut.xyz
# ========================================================
# Place on VPS at: /etc/nginx/sites-available/ai-classroom
# Enable: ln -sf /etc/nginx/sites-available/ai-classroom /etc/nginx/sites-enabled/ai-classroom
# Test: nginx -t
# Restart: systemctl restart nginx

# Port 80 - HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name realtime.avelut.xyz;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# Port 443 - HTTPS with SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name realtime.avelut.xyz;

    # ========== SSL CONFIGURATION ==========
    # Obtain Let's Encrypt certificates:
    #   sudo certbot --nginx -d realtime.avelut.xyz
    
    # If using Let's Encrypt (recommended):
    ssl_certificate /etc/letsencrypt/live/realtime.avelut.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realtime.avelut.xyz/privkey.pem;
    
    # SSL Protocols and Ciphers (secure configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:130m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # HSTS header (additionally secure)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ========== SSL SECURITY HEADERS ==========
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self';" always;

    # ========== GZIP COMPRESSION ==========
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 64;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss application/font-woff2;

    # ========== LOG SETTINGS ==========
    access_log /var/log/nginx/ai-classroom.access.log combined;
    error_log /var/log/nginx/ai-classroom.error.log warn;

    # ========== MAIN API ROUTES ==========
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # WebSocket support
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # ========== API PREFIX ROUTES ==========
    # All /api/* routes will be proxied to the backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # API-specific caching (optional)
        # proxy_cache_valid 200 301 302 30s;
    }

    # ========== ADMIN / DOCS (conditional) ==========
    # Only enable in development or behind VPN
    # location /admin {
    #     proxy_pass http://127.0.0.1:8000;
    #     ...
    # }
    
    # location /api/docs {
    #     proxy_pass http://127.0.0.1:8000;
    #     ...
    # }
    
    # location /api/redoc {
    #     proxy_pass http://127.0.0.1:8000;
    #     ...
    # }
}